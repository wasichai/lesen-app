name: lesen
description: 'Lesen: aprender idiomas leyendo. Cliente móvil de la plataforma Lesen.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.4
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
        - asset: assets/fonts/SourceSans3-Italic.ttf
          style: italic
