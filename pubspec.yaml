name: lesen
description: 'Lesen: aprender idiomas leyendo. Cliente móvil de la plataforma Lesen.'
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  clock: ^1.1.3
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.4
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader.ttf
        - asset: assets/fonts/Newsreader-Italic.ttf
          style: italic
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/SourceSans3.ttf
        - asset: assets/fonts/SourceSans3-Italic.ttf
          style: italic
    # identidades seleccionables (ADR-0011): variables en peso, subconjunto latin, latin-ext y AFI (docs/design/README.md)
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4.ttf
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          style: italic
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans.ttf
        - asset: assets/fonts/IBMPlexSans-Italic.ttf
          style: italic
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist.ttf
        - asset: assets/fonts/Geist-Italic.ttf
          style: italic
